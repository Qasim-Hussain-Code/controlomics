[build-system]
requires = ["setuptools>=80.9,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "controlomics"
version = "0.1.0.dev0"
description = "Structured scientific controls and evidence records for computational biology"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Private attribution removed"}]
dependencies = ["pydantic>=2.12.4,<3"]

[project.scripts]
controlomics = "controlomics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
