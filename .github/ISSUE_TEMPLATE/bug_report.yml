name: Software bug
description: Report a reproducible problem using synthetic or public inputs.
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Remove personal information, credentials, raw research data, project exports, source excerpts, and local filesystem paths. Use a minimal synthetic example. See SECURITY.md for vulnerabilities; do not disclose them here.
  - type: input
    id: version
    attributes:
      label: Software version and environment
      placeholder: Controlomics version, Python version, operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example and commands where useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public disclosure check
      options:
        - label: I reviewed this issue and any attachments for confidential or personal information.
          required: true
